name: Refresh SafeMap emergency-bell data
# Triggered by workflow updates so the latest repository secret can be tested.

on:
  push:
    paths:
      - ".github/workflows/refresh-safety-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official SafeMap emergency-bell coordinates
        env:
          SAFEMAP_SERVICE_KEY: ${{ secrets.SAFEMAP_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, urllib.parse, urllib.request, urllib.error, xml.etree.ElementTree as ET

          raw_key = os.environ.get("SAFEMAP_SERVICE_KEY", "").strip()
          out = pathlib.Path("data")
          out.mkdir(exist_ok=True)
          status = {
              "checkedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "sources": {
                  "emergencyBells": {"ok": False, "message": "SAFEMAP_SERVICE_KEY secret is not configured."},
                  "securityLights": {
                      "ok": False,
                      "mode": "WMS",
                      "message": "Official SafeMap security-light point-list XML/JSON is marked as not yet provided. WMS layer is available through the secure proxy in worker/safemap-proxy.js."
                  }
              }
          }

          def walk(v, rows):
              if isinstance(v, list):
                  for x in v: walk(x, rows)
              elif isinstance(v, dict):
                  keys = {str(k).lower() for k in v}
                  if "lat" in keys and "lon" in keys:
                      rows.append(v)
                  for x in v.values():
                      if isinstance(x, (dict, list)): walk(x, rows)

          if raw_key:
              key = urllib.parse.unquote(raw_key)
              all_rows = []
              total = None
              try:
                  for page in range(1, 10001):
                      params = urllib.parse.urlencode({
                          "serviceKey": key,
                          "pageNo": page,
                          "numOfRows": 100,
                          "returnType": "json"
                      })
                      url = "https://www.safemap.go.kr/openapi2/IF_0032?" + params
                      req = urllib.request.Request(url, headers={"User-Agent": "SafeWay/1.0", "Accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=60) as res:
                          raw = res.read().decode("utf-8-sig")
                      try:
                          payload = json.loads(raw)
                      except json.JSONDecodeError:
                          root = ET.fromstring(raw)
                          payload = {child.tag: child.text for child in root.iter() if child.text and len(child) == 0}
                      rows = []
                      walk(payload, rows)
                      if not rows and page == 1:
                          # Surface only provider message, never request URL or credential.
                          msg = str(payload)[:800]
                          raise RuntimeError("No coordinate rows in provider response: " + msg)
                      all_rows.extend(rows)
                      def find_total(v):
                          if isinstance(v, dict):
                              for k, x in v.items():
                                  if str(k).lower() == "totalcount":
                                      try: return int(x)
                                      except Exception: pass
                                  got = find_total(x)
                                  if got is not None: return got
                          if isinstance(v, list):
                              for x in v:
                                  got = find_total(x)
                                  if got is not None: return got
                          return None
                      if total is None: total = find_total(payload)
                      if len(rows) < 100 or (total is not None and page * 100 >= total):
                          break
                  if not all_rows:
                      raise RuntimeError("The service returned zero emergency-bell coordinate rows.")
                  (out / "emergency-bells.json").write_text(json.dumps({
                      "source": "SafeMap IF_0032 / official emergency bell location service",
                      "fetchedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "items": all_rows
                  }, ensure_ascii=False), encoding="utf-8")
                  status["sources"]["emergencyBells"] = {"ok": True, "count": len(all_rows)}
              except Exception as e:
                  status["sources"]["emergencyBells"] = {"ok": False, "error": str(e)[:800]}

          (out / "source-status.json").write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False))
          PY
      - name: Commit refreshed data and source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Refresh official SafeMap emergency-bell data" && git push)
